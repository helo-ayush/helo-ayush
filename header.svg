<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#120c1f" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F2FF" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#7000FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" />
  <rect width="900" height="240" rx="16" fill="url(#cyanOrb)" />
  <rect width="900" height="240" rx="16" fill="url(#purpleOrb)" />

  <!-- Subtle Cyber Grid Background -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Glowing Border Outline -->
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" />

  <!-- Geometric Corner Accents -->
  <path d="M 12 35 L 12 12 L 35 12" stroke="#00F2FF" stroke-width="2.5" fill="none" />
  <path d="M 888 35 L 888 12 L 865 12" stroke="#7000FF" stroke-width="2.5" fill="none" />
  <path d="M 12 205 L 12 228 L 35 228" stroke="#00F2FF" stroke-width="2.5" fill="none" />
  <path d="M 888 205 L 888 228 L 865 228" stroke="#7000FF" stroke-width="2.5" fill="none" />

  <!-- Content Center -->
  <g text-anchor="middle">
    <!-- Mini Tag -->
    <rect x="360" y="30" width="180" height="24" rx="12" fill="#00F2FF" fill-opacity="0.1" stroke="#00F2FF" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="376" cy="42" r="3.5" fill="#00FF88" filter="url(#glow)" />
    <text x="455" y="46" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#00F2FF" letter-spacing="2">SYSTEM OPERATIONAL</text>

    <!-- Main Title: AYUSH KUMAR -->
    <text x="450" y="118" font-family="'Orbitron', 'Segoe UI', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="6">
      AYUSH <tspan fill="url(#cyberCyan)">KUMAR</tspan>
    </text>

    <!-- Glowing Accent Line -->
    <line x1="250" y1="140" x2="650" y2="140" stroke="url(#lineGrad)" stroke-width="2" />

    <!-- Subtitle / Roles -->
    <text x="450" y="176" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#A3B1CC" letter-spacing="3">
      AI ENGINEER <tspan fill="#00F2FF">•</tspan> GEN-AI &amp; VISION ARCHITECT <tspan fill="#7000FF">•</tspan> FULL STACK
    </text>

    <!-- Tech Badges Line -->
    <g transform="translate(0, 196)">
      <text x="450" y="14" font-family="'Fira Code', monospace" font-size="12" font-weight="500" fill="#586A8A">
        [ Python • ONNX WASM • PyTorch • LangGraph • React • Next.js ]
      </text>
    </g>
  </g>
</svg>
